<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onset onboarding preview</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #eef1f6;
        font-family: Arial, sans-serif;
        color: #0f172a;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 32px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }

      figure {
        margin: 0;
        border-radius: 16px;
        overflow: hidden;
        background: white;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
      }

      img {
        display: block;
        width: 100%;
      }

      figcaption {
        padding: 12px 14px 14px;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Onset: регистрация и анкета по шагам</h1>
    <div class="grid">
      <figure><img src="01-register-role.png" /><figcaption>1. Регистрация - роль</figcaption></figure>
      <figure><img src="02-register-email.png" /><figcaption>2. Регистрация - email</figcaption></figure>
      <figure><img src="03-register-phone.png" /><figcaption>3. Регистрация - телефон</figcaption></figure>
      <figure><img src="04-register-password.png" /><figcaption>4. Регистрация - пароль</figcaption></figure>
      <figure><img src="05-register-terms.png" /><figcaption>5. Регистрация - условия</figcaption></figure>
      <figure><img src="06-check-email.png" /><figcaption>6. Подтверждение email</figcaption></figure>
      <figure><img src="07-onboarding-name.png" /><figcaption>7. Анкета актера - имя</figcaption></figure>
      <figure><img src="08-onboarding-city.png" /><figcaption>8. Анкета актера - город</figcaption></figure>
      <figure><img src="09-onboarding-about.png" /><figcaption>9. Анкета актера - о себе</figcaption></figure>
      <figure><img src="10-onboarding-experience.png" /><figcaption>10. Анкета актера - опыт</figcaption></figure>
      <figure><img src="11-onboarding-age.png" /><figcaption>11. Анкета актера - возраст</figcaption></figure>
      <figure><img src="12-onboarding-height.png" /><figcaption>12. Анкета актера - рост</figcaption></figure>
      <figure><img src="13-onboarding-gender.png" /><figcaption>13. Анкета актера - пол</figcaption></figure>
      <figure><img src="14-onboarding-photo.png" /><figcaption>14. Анкета актера - фото</figcaption></figure>
      <figure><img src="15-onboarding-contacts.png" /><figcaption>15. Анкета актера - контакты</figcaption></figure>
      <figure><img src="16-creator-specialty.png" /><figcaption>16. Креатор - специализация</figcaption></figure>
      <figure><img src="17-location-name.png" /><figcaption>17. Локация - название</figcaption></figure>
      <figure><img src="18-customer-name.png" /><figcaption>18. Заказчик - имя/компания</figcaption></figure>
    </div>
  </body>
</html>
